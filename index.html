<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glyphborne</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="game"></div>

    <div id="labels"></div>

    <div id="hud">
      <div id="party"></div>
      <div id="target" class="hidden"></div>
      <div id="zone">~ Ashenmere Glade ~</div>
      <div id="perf"></div>
      <div id="log"></div>
      <div id="hints">
        [WASD] move &nbsp; [Shift] run &nbsp; [Space / Click] strike &nbsp; [Q/E] turn camera &nbsp;
        [Wheel] zoom &nbsp; [ [ / ] ] glyph size &nbsp; [H] hide hints
      </div>
    </div>

    <div id="title">
      <pre id="logo"></pre>
      <div id="tagline">a knight's tale, written in characters</div>
      <div id="press">- press any key to begin -</div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
